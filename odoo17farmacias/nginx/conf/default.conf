user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 200M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
            application/json application/javascript application/xml+rss 
            application/rss+xml font/truetype font/opentype 
            application/vnd.ms-fontobject image/svg+xml;

    # Cache de archivos estáticos
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=odoo_cache:100m max_size=1g inactive=60m use_temp_path=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=odoo_limit:10m rate=30r/s;

    # Upstream Odoo lailengfarma
    upstream odoo_lailengfarma {
        server odoo_lailengfarma:8069 max_fails=3 fail_timeout=30s;
    }

    # Upstream Odoo lailengfarma Longpolling
    upstream odoo_lailengfarma_longpolling {
        server odoo_lailengfarma:8072 max_fails=3 fail_timeout=30s;
    }
    
    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name lailengfarma.inbrasol.pe;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        http2 on;
        server_name lailengfarma.inbrasol.pe;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/lailengfarma.inbrasol.pe/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lailengfarma.inbrasol.pe/privkey.pem;

        # SSL Configuration (Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy settings
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;

        # Aumentar buffer para PDFs grandes
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Longpolling/WebSocket
        location /websocket {
            proxy_pass http://odoo_lailengfarma_longpolling;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Cache para archivos estáticos
        location ~* /web/static/ {
            proxy_cache odoo_cache;
            proxy_cache_valid 200 304 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 1;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_pass http://odoo_lailengfarma;
            expires 7d;
        }

        # Cache para assets de módulos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_cache odoo_cache;
            proxy_cache_valid 200 304 60m;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_pass http://odoo_lailengfarma;
            expires 7d;
        }

        # Rate limiting para rutas principales
        location / {
            limit_req zone=odoo_limit burst=50 nodelay;
            proxy_pass http://odoo_lailengfarma;
        }
    }
}