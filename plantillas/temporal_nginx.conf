upstream odoo_lailengfarma {
    server odoo_lailengfarma:8069;
}

server {
    listen 80;
    server_name lailengfarma.inbrasol.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://odoo_lailengfarma;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}