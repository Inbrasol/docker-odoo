upstream odoo_lailengfarma {
    server odoo_lailengfarma:8069;
}

upstream odoo_lailengfarma_longpolling {
    server odoo_lailengfarma:8072;
}

server {
    listen 80;
    server_name lailengfarma.inbrasol.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lailengfarma.inbrasol.pe;

    ssl_certificate /etc/letsencrypt/live/lailengfarma.inbrasol.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lailengfarma.inbrasol.pe/privkey.pem;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;

    location /websocket {
        proxy_pass http://odoo_lailengfarma_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location / {
        proxy_pass http://odoo_lailengfarma;
    }
}